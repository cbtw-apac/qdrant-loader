# CodeRabbit configuration for the HarborRAG Python monorepo.
# Place this file at repository root as `.coderabbit.yaml`.
# Schema reference: https://docs.coderabbit.ai/reference/configuration

language: "en-US"

tone_instructions: >
  Be direct, precise, and engineering-focused. Prioritize correctness, package
  boundary violations, security, resource safety, async/concurrency risks,
  provider lifecycle issues, and test coverage. Do not spend review budget on
  formatting nits already handled by Ruff, Black, or isort. For every issue,
  include a concrete fix suggestion and one-sentence rationale.

reviews:
  profile: assertive
  request_changes_workflow: true
  review_status: true
  high_level_summary: true
  review_details: true
  poem: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop
      - release/.*
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[skip review]"
    ignore_usernames:
      - dependabot[bot]
      - renovate[bot]
      - github-actions[bot]
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5

  path_filters:
    - "**/*"
    - "!**/.venv/**"
    - "!**/venv/**"
    - "!**/env/**"
    - "!**/.tox/**"
    - "!**/.mypy_cache/**"
    - "!**/.ruff_cache/**"
    - "!**/.pytest_cache/**"
    - "!**/__pycache__/**"
    - "!**/.egg-info/**"
    - "!**/build/**"
    - "!**/dist/**"
    - "!**/htmlcov/**"
    - "!**/.coverage"
    - "!**/coverage.xml"
    - "!**/*.lock"
    - "!**/*.zip"
    - "!**/*.tar"
    - "!**/*.tar.gz"
    - "!**/*.whl"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.pdf"

  high_level_summary_instructions: >
    Summarize: (1) which HarborRAG package boundaries are touched,
    (2) whether public contracts/base classes changed, (3) whether mocks and
    package-local tests were updated, (4) whether coverage remains at least 95%,
    and (5) any security, async, resource-lifecycle, or dependency-direction risk.
    Keep it under 180 words.

  auto_title_instructions: >
    Follow Conventional Commits: type(scope): description.
    Valid types: feat, fix, refactor, perf, test, docs, ci, chore.
    Scope should be the package or feature family, for example core, adapters,
    connectors, parsers, repositories, engine, runtime, app, mcp, tests, ci.

  path_instructions:
    - path: "packages/harborrag-core/src/harborrag_core/**"
      instructions: >
        Core is the pure contract/domain layer. Verify that it does not import
        harborrag_adapters, harborrag_engine, harborrag_runtime, harborrag_app,
        harborrag_mcp, or the meta-package. New domain objects should be small,
        deterministic, typed, and dependency-light. Flag provider SDK imports,
        network calls, filesystem side effects, environment reads, or concrete
        adapter references in core.

    - path: "packages/harborrag-core/src/harborrag_core/ports/**"
      instructions: >
        Ports define Protocol or abstract boundaries only. Check that ports do
        not contain provider-specific implementation logic, concrete registry
        lookup, hardcoded SDK types, HTTP clients, database clients, or cloud
        credentials. When a port changes, require corresponding mock/fake tests
        under packages/harborrag-core/tests and affected adapter mock updates.

    - path: "packages/harborrag-core/src/harborrag_core/security/**"
      instructions: >
        Security helpers are a trust boundary. Check that secret redaction covers
        api_key, token, password, secret, credential, Authorization Bearer, and
        common cloud/API key forms. URL policy must reject unsafe schemes and
        make SSRF-prone host handling explicit. Do not allow secrets in repr,
        logs, exception messages, or serialized diagnostics.

    - path: "packages/harborrag-adapters/src/harborrag_adapters/connectors/**"
      instructions: >
        Connectors must normalize external sources into core RawDocument or
        SourceRecord shapes. Base and mock implementations must stay in this
        folder. When adding real connectors, require explicit authentication
        handling, pagination termination, retry/rate-limit strategy, timeout,
        session cleanup, source metadata, stable IDs, and secret redaction. Flag
        raw requests without timeout, unbounded directory crawls, path traversal,
        shell command construction, and connector code that bypasses core ports.

    - path: "packages/harborrag-adapters/src/harborrag_adapters/parsers/**"
      instructions: >
        Parsers convert raw content into ParsedDocument without doing ingestion
        orchestration. Base and mock implementations must stay in this folder.
        Check file-size guards, temp-file cleanup, subprocess timeouts, parser
        fallback behavior, parse quality metadata, and preservation of structured
        elements. For PDF/Office engines, flag unbounded memory reads, unsafe
        shell calls, missing fallback warnings, and provider raw payload leakage
        outside explicit diagnostic fields.

    - path: "packages/harborrag-adapters/src/harborrag_adapters/models/**"
      instructions: >
        Model adapters must implement chat, embedding, or reranker boundaries.
        Check provider-local capability profiles, optional dependency errors with
        install hints, timeout/retry/rate-limit behavior, deterministic mock
        outputs, and no provider SDK imports outside adapters. Raw provider
        responses must not appear in default outputs except debug/raw diagnostic
        fields.

    - path: "packages/harborrag-adapters/src/harborrag_adapters/repositories/**"
      instructions: >
        This is the storage adapter layer. Use repositories/ naming, not stores/.
        Base and mock implementations must live in each family folder: vector,
        graph, cache, object_store, database, and state when added. Check
        connection lifecycle, transaction boundaries, parameterized SQL, object
        path traversal prevention, cache TTL semantics, vector namespace support,
        graph relationship normalization, and missing optional dependency errors.

    - path: "packages/harborrag-adapters/src/harborrag_adapters/builder.py"
      instructions: >
        The adapter builder is a composition helper, not an engine pipeline.
        Check that it validates provider names, returns objects compatible with
        core ports/base classes, and does not import engine/runtime/app/MCP.
        If a new adapter family is introduced, require a registry entry, mock,
        package-local tests, and README update.

    - path: "packages/harborrag-engine/src/harborrag_engine/ingestion/**"
      instructions: >
        Ingestion orchestrates connector -> parser -> normalization -> chunking
        -> indexing through ports/base classes. It must not import concrete
        provider SDKs or adapter clients directly. Check error propagation,
        checkpoint semantics, duplicate handling, graph hint preservation,
        object artifact writing boundaries, and that broad exceptions are either
        converted to structured run errors or deliberately re-raised.

    - path: "packages/harborrag-engine/src/harborrag_engine/retrieval/**"
      instructions: >
        Retrieval owns query rewriting, vector/graph search orchestration, score
        fusion, reranking, and context reconstruction. Check deterministic score
        combination, stable ordering for equal scores, top_k handling, no hidden
        provider dependencies, no mutation of input results unless documented,
        and tests for empty, duplicate, tie-score, and low-score cases.

    - path: "packages/harborrag-engine/src/harborrag_engine/indexing/**"
      instructions: >
        Indexing should coordinate embedding and repository writes through ports.
        Check batch-size handling, partial-failure reporting, idempotency,
        namespace/tenant propagation, and no direct vector DB client imports.
        New indexers must include mock tests with empty, single-item, and batch
        cases.

    - path: "packages/harborrag-engine/src/harborrag_engine/graph/**"
      instructions: >
        Graph engine code should map GraphHint/domain relationships to graph
        repository operations. Check relationship direction, stable node IDs,
        duplicate edge behavior, confidence propagation, and no Cypher/AQL string
        construction inside engine code unless explicitly delegated to a graph
        repository adapter.

    - path: "packages/harborrag-runtime/src/harborrag_runtime/**"
      instructions: >
        Runtime owns process boundaries, jobs, schedules, supervisors, and future
        Temporal integration. It must not contain domain-specific ingestion or
        retrieval business logic. Check bounded worker counts, job-state
        transitions, cancellation, retry policy, schedule persistence, and no
        blocking I/O inside future async workers. Temporal placeholders should
        remain optional and must not become required imports for local runtime.

    - path: "packages/harborrag-app/src/harborrag_app/api/**"
      instructions: >
        API code is the external HTTP boundary. When FastAPI or another framework
        is added, route handlers must validate inputs with explicit request
        schemas, return stable error envelopes, avoid leaking stack traces or
        secrets, and call runtime/engine service facades rather than raw adapters.
        Any new route needs package-local tests under packages/harborrag-app/tests.

    - path: "packages/harborrag-app/src/harborrag_app/cli/**"
      instructions: >
        CLI commands must support JSON output for automation, deterministic exit
        codes, sanitized errors, and no stack traces unless an explicit debug flag
        is set. Check that command implementations call app/runtime services, not
        raw adapters, and that new commands update README and tests.

    - path: "packages/harborrag-app/src/harborrag_app/services/**"
      instructions: >
        App services adapt external API/CLI calls into runtime operations. They
        should not embed connector/parser/model/repository logic. Check stable
        response DTOs, structured diagnostics, and no raw provider response leak
        in normal output.

    - path: "packages/harborrag-mcp/src/harborrag_mcp/**"
      instructions: >
        MCP exposes an audited service-only facade for agents. Tools must have
        explicit input/output schemas, capability budgets, sanitized errors, and
        audit entries. Do not expose raw vector DB, graph DB, cache, object store,
        or SQL execution tools directly. Any new tool must include a mock server
        test and must call app/runtime services through a safe boundary.

    - path: "packages/harborrag*/tests/**"
      instructions: >
        Every package owns its own tests. New base classes require abstract/base
        behavior tests; new mocks require deterministic behavior tests; new
        providers require fake-client tests and optional integration tests. Avoid
        brittle sleep-based tests. Keep coverage at or above 95% for the repo.

    - path: "tests/**"
      instructions: >
        Root tests should cover cross-package behavior: import smoke tests,
        dependency-direction rules, CLI smoke, and integration contracts. Do not
        duplicate package-local unit tests here. If a cross-package rule changes,
        explain why in the PR description.

    - path: "scripts/**"
      instructions: >
        Scripts must be safe for local developer use. Check repo-root discovery,
        no shell=True with user input, helpful JSON output where relevant,
        deterministic exit codes, and no writes outside the repository unless an
        explicit output path is provided and validated.

    - path: ".github/workflows/**"
      instructions: >
        Check GitHub Actions for least-privilege permissions, pinned action
        versions, no pull_request_target for untrusted code, no secrets exposed
        to fork PRs, concurrency groups for long jobs, Python 3.12 consistency,
        and commands matching Makefile/pyproject configuration.

    - path: "pyproject.toml"
      instructions: >
        Root pyproject is the workspace/tooling source of truth. Check Python
        requires-python is >=3.12, uv workspace members include every package,
        dev/docs dependencies are not placed in main dependencies, coverage omit
        excludes tests/build artifacts, Ruff/Black/isort/mypy agree on Python
        version and line length, and pytest discovers package-local tests.

    - path: "packages/*/pyproject.toml"
      instructions: >
        Package pyproject files must use Python >=3.12 and declare only required
        runtime dependencies. Do not add provider SDK dependencies to core. Keep
        optional provider dependencies in adapter extras. Package names should
        match workspace membership and README ownership.

    - path: "README.md"
      instructions: >
        Root README should onboard open-source contributors. Check that package
        map, quickstart commands, current status, testing instructions, and
        architecture boundaries match the actual repository structure. Avoid
        claiming implemented providers that are only TODO/mock placeholders.

    - path: "packages/*/README.md"
      instructions: >
        Package README files should explain ownership, public API, base/mock
        files, teammate deliverables, and boundary rules for that package. Flag
        outdated paths such as stores/ if the code uses repositories/.

  pre_merge_checks:
    title:
      mode: warning
      requirements: >
        PR title should follow Conventional Commits: type(scope): description.
        Valid types: feat, fix, refactor, perf, test, docs, ci, chore.
    description:
      mode: warning
    docstrings:
      mode: warning
      threshold: 60
    custom_checks:
      - name: "No core upward imports"
        mode: error
        instructions: >
          Fail if any file under packages/harborrag-core/src imports
          harborrag_adapters, harborrag_engine, harborrag_runtime,
          harborrag_app, harborrag_mcp, or harborrag. Core must remain pure.

      - name: "Mock and tests for new base"
        mode: error
        instructions: >
          Fail if a new base.py or abstract class is added under any package
          without a corresponding mock.py in the same feature folder and a
          package-local test under that package's tests/ directory.

      - name: "Repositories naming only"
        mode: error
        instructions: >
          Fail if new adapter storage code uses a stores/ path or store module
          naming for the adapter package. The project convention is
          harborrag_adapters/repositories/ with vector, graph, cache,
          object_store, database, and state families.

      - name: "No hardcoded credentials"
        mode: error
        instructions: >
          Fail if any hardcoded API key, token, password, secret, credential,
          Authorization header, GitHub token, OpenAI key, cloud key, database
          password, or bearer token appears in non-test source code.

      - name: "Provider deps stay in adapters"
        mode: error
        instructions: >
          Fail if provider SDK imports such as qdrant_client, neo4j, redis,
          boto3, pymongo, openai, anthropic, docling, paddleocr, or requests
          are added outside harborrag-adapters or clearly optional integration
          test code.

      - name: "Package-local tests required"
        mode: error
        instructions: >
          Fail if production code changes under packages/<name>/src but no
          package-local test changes appear under packages/<name>/tests, unless
          the PR explicitly explains why tests are not needed.

      - name: "Coverage gate preserved"
        mode: warning
        instructions: >
          Warn if pyproject.toml or CI lowers the coverage fail_under value below
          95 or stops running package-local tests.

  tools:
    ruff:
      enabled: true
    semgrep:
      enabled: true
    trufflehog:
      enabled: true
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    hadolint:
      enabled: true
    shellcheck:
      enabled: true
    checkmake:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 900000

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "TEST_TUTORIAL.md"
      - "packages/*/README.md"
      - "**/AGENTS.md"
      - ".github/copilot-instructions.md"
  learnings:
    scope: local
    approval_delay: 7
  issues:
    scope: local
  pull_requests:
    scope: local

code_generation:
  docstrings:
    language: "en-US"
    path_instructions:
      - path: "packages/harborrag-core/src/harborrag_core/**"
        instructions: >
          Generate docstrings only when they clarify public contracts or tricky
          invariants. Keep them concise and avoid restating type annotations.
      - path: "packages/harborrag-adapters/src/harborrag_adapters/**"
        instructions: >
          Mention provider lifecycle expectations, optional dependency behavior,
          and whether the class is a base, mock, or real adapter.
  unit_tests:
    path_instructions:
      - path: "packages/*/src/**"
        instructions: >
          Add package-local tests under the matching packages/<name>/tests
          directory. Cover happy path, empty input, error path, and boundary rule.

chat:
  auto_reply: true
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto
