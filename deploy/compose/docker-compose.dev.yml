name: harborrag-dev

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    env_file:
      - ../../.env
    environment:
      HARBORRAG_ENV: dev
      HARBORRAG_QDRANT_URL: http://qdrant:6333
      HARBORRAG_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - redis
    volumes:
      - ../../packages:/app/packages
      - ../../examples:/app/examples
      - ../../.harbor:/app/.harbor

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage
      - ../qdrant/config.yaml:/qdrant/config/config.yaml:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  qdrant_dev_data:
  redis_dev_data:
