[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "harborrag-workspace"
version = "0.1.0"
description = "A modular, provider-agnostic RAG framework for engineering knowledge with connectors, parsers, repositories, runtime, API, and MCP support"
readme = "README.md"
authors = [
    { name = "CBTW APAC Development Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Environment :: Console",
    "Typing :: Typed",
]
requires-python = ">=3.12"

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/cbtw-apac/HarborRAG"
Repository = "https://github.com/cbtw-apac/HarborRAG"
Issues = "https://github.com/cbtw-apac/HarborRAG/issues"
Documentation = "https://github.com/cbtw-apac/HarborRAG/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.8.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "requests>=2.28.0",
    "responses>=0.24.1",
    "requests-mock>=1.11.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "prometheus-client>=0.19.0,<1.0.0",
]
docs = [
    "tomli>=2.0.0",
    "markdown>=3.5.0",
    "pygments>=2.15.0",
    "pymdown-extensions>=10.0.0",
]

# The workspace root is a metadata-only project. Each package under packages/*
# owns its own build configuration and importable src/ package.
[tool.setuptools]
py-modules = []

[tool.black]
line-length = 88
target-version = ["py312"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  # directories
  \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = [
    "harborrag",
    "harborrag_core",
    "harborrag_adapters",
    "harborrag_engine",
    "harborrag_runtime",
    "harborrag_app",
    "harborrag_mcp",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
mypy_path = "packages/harborrag-core/src:packages/harborrag-adapters/src:packages/harborrag-engine/src:packages/harborrag-runtime/src:packages/harborrag-app/src:packages/harborrag-mcp/src:packages/harborrag/src"

# Package-local tests deliberately exercise abstract base classes (safe-super)
# and index into loosely-typed diagnostics payloads; keep strictness for src only.
exclude = "packages/[^/]+/tests/"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/harborrag-core/tests",
    "packages/harborrag-adapters/tests",
    "packages/harborrag-engine/tests",
    "packages/harborrag-runtime/tests",
    "packages/harborrag-app/tests",
    "packages/harborrag-mcp/tests",
    "packages/harborrag/tests",
]
norecursedirs = [
    ".*",
    "build",
    "dist",
    "venv",
    "env",
    "node_modules",
    "htmlcov",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "smoke: fast import and wiring tests",
    "blackbox: public API behavior tests",
    "whitebox: internal architecture and contract tests",
    "requires_deps: marks tests requiring optional dependencies",
    "workflow: marks tests that validate GitHub Actions workflow",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = [
    "packages/harborrag-core/src",
    "packages/harborrag-adapters/src",
    "packages/harborrag-engine/src",
    "packages/harborrag-runtime/src",
    "packages/harborrag-app/src",
    "packages/harborrag-mcp/src",
    "packages/harborrag/src",
]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/site/*",
    "*/htmlcov*/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = [
    "packages",
    "tests",
    "scripts",
]
extend-exclude = [
    "venv",
    "venv-*",
    "**/venv/**",
    "**/.venv/**",
    "env",
    "env-*",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
    "B017",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011", "B017"]
"packages/*/tests/*" = ["B011", "B017"]

[tool.uv]
environments = [
    "python_version == '3.12'",
]

[tool.uv.workspace]
members = [
    "packages/harborrag-core",
    "packages/harborrag-adapters",
    "packages/harborrag-engine",
    "packages/harborrag-runtime",
    "packages/harborrag-app",
    "packages/harborrag-mcp",
    "packages/harborrag",
]

[tool.uv.sources.harborrag-core]
workspace = true

[tool.uv.sources.harborrag-adapters]
workspace = true

[tool.uv.sources.harborrag-engine]
workspace = true

[tool.uv.sources.harborrag-runtime]
workspace = true

[tool.uv.sources.harborrag-app]
workspace = true

[tool.uv.sources.harborrag-mcp]
workspace = true

[tool.uv.sources.harborrag]
workspace = true
