name: Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dev dependencies
        run: uv sync --all-packages --all-extras

      - name: Lint
        run: uv run make lint

      - name: Type check
        run: uv run make typecheck

      - name: Dependency direction check
        run: uv run make deps-check

      - name: Compile check
        run: uv run make compile

      - name: Coverage gate
        run: uv run make coverage
