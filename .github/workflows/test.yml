name: Test and Coverage

on:
  push:
    branches: [ main, develop, feature/*, bugfix/*, release/*, fix/* ]
  pull_request:
    branches: [ main, develop, feature/*, bugfix/*, release/*, fix/* ]

permissions:
  contents: read
  actions: read

concurrency:
  group: "test-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test-packages:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - harborrag-core
          - harborrag-adapters
          - harborrag-engine
          - harborrag-runtime
          - harborrag-app
          - harborrag-mcp
          - harborrag
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Run tests with coverage
        run: |
          cd packages/${{ matrix.package }}
          uv run python -m pytest tests/ --cov=src --cov-report=term-missing -v

      - name: Generate coverage reports
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
          (github.event_name == 'push' && github.ref_name == 'main')
        run: |
          cd packages/${{ matrix.package }}
          uv run coverage xml -o ../../coverage-${{ matrix.package }}.xml
          uv run coverage html -d ../../htmlcov-${{ matrix.package }}

      - name: Upload coverage artifact
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
          (github.event_name == 'push' && github.ref_name == 'main')
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package }}-${{ github.run_id }}
          path: |
            htmlcov-${{ matrix.package }}
            coverage-${{ matrix.package }}.xml
          retention-days: 30

  test-website:
    name: Test Website Build System
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system dependencies for website testing
        run: |
          # Install system dependencies that might be needed for favicon generation
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgirepository1.0-dev

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Run website tests with coverage
        run: |
          # Add website directory to Python path and run tests
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/website"
          uv run python -m pytest tests/ --cov=website --cov-report=xml:coverage-website.xml --cov-report=html:htmlcov-website --cov-report=term-missing -v

      - name: Upload website test coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-website-${{ github.run_id }}
          path: |
            htmlcov-website
            coverage-website.xml
          retention-days: 30

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-packages, test-website]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "=== Test Results Summary ==="
          echo "Package Tests: ${{ needs.test-packages.result }}"
          echo "Website Build Tests: ${{ needs.test-website.result }}"

          if [ "${{ needs.test-packages.result }}" != "success" ] || [ "${{ needs.test-website.result }}" != "success" ]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi

      - name: Create test status artifact
        run: |
          mkdir -p test-results
          cat > test-results/status.json <<EOF
          {
            "packages_status": "${{ needs.test-packages.result }}",
            "website_status": "${{ needs.test-website.result }}",
            "overall_status": "${{ (needs.test-packages.result == 'success' && needs.test-website.result == 'success') && 'success' || 'failure' }}",
            "run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "Test run completed at $(date)" > test-results/summary.txt
          echo "Run ID: ${{ github.run_id }}" >> test-results/summary.txt
          echo "Commit: ${{ github.sha }}" >> test-results/summary.txt
          echo "Branch: ${{ github.ref_name }}" >> test-results/summary.txt
          echo "Package Tests: ${{ needs.test-packages.result }}" >> test-results/summary.txt
          echo "Website Tests: ${{ needs.test-website.result }}" >> test-results/summary.txt

      - name: Upload test status artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-status-${{ github.run_id }}
          path: test-results/
          retention-days: 30
