name: Publish Packages to PyPI

on:
  release:
    types: [created]

# Set minimal permissions for the workflow
permissions:
  contents: read

jobs:
  determine-package:
    name: Determine which package to publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package: ${{ steps.check.outputs.package }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check release tag
        id: check
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Tags follow the release.py convention: <package-name>-v<version>
          PACKAGE="${TAG_NAME%-v*}"
          case "$PACKAGE" in
            harborrag-core|harborrag-adapters|harborrag-engine|harborrag-runtime|harborrag-app|harborrag-mcp|harborrag)
              echo "package=$PACKAGE" >> $GITHUB_OUTPUT
              echo "publish=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Tag '$TAG_NAME' does not match a known package, skipping publish"
              echo "package=" >> $GITHUB_OUTPUT
              echo "publish=false" >> $GITHUB_OUTPUT
              ;;
          esac

  publish-package:
    name: Publish ${{ needs.determine-package.outputs.package }} to PyPI
    runs-on: ubuntu-latest
    needs: determine-package
    if: needs.determine-package.outputs.publish == 'true'
    environment:
      name: ${{ vars.PYPI_ENVIRONMENT || 'pypi-publish' }}
      url: https://pypi.org/p/${{ needs.determine-package.outputs.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          cd packages/${{ needs.determine-package.outputs.package }}
          uv build --out-dir dist/

      - name: Publish package to PyPI
        id: publish_package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/${{ needs.determine-package.outputs.package }}/dist/

      - name: Notify teams on success
        if: ${{ steps.publish_package.conclusion == 'success' }}
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          PACKAGE: ${{ needs.determine-package.outputs.package }}
          URL: https://pypi.org/p/${{ needs.determine-package.outputs.package }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "TEAMS_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg tag_name "$TAG_NAME" \
            --arg actor "$GITHUB_ACTOR" \
            --arg url "$URL" \
            --arg package "$PACKAGE" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  type: "AdaptiveCard",
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  version: "1.4",
                  body: [
                    { type: "TextBlock", weight: "Bolder", size: "Medium", text: "\($package) package published to PyPI successfully", color: "Good" },
                    { type: "FactSet", facts: [
                      { title: "Tag name", value: $tag_name },
                      { title: "Triggered by", value: $actor },
                      { title: "URL", value: $url }
                    ]}
                  ]
                }
              }]
            }')
          curl -fsS --max-time 30 -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"

      - name: Notify teams on failure
        if: ${{ always() && steps.publish_package.conclusion == 'failure' }}
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          PACKAGE: ${{ needs.determine-package.outputs.package }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "TEAMS_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PAYLOAD=$(jq -n \
            --arg tag_name "$TAG_NAME" \
            --arg actor "$GITHUB_ACTOR" \
            --arg url "$RUN_URL" \
            --arg package "$PACKAGE" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  type: "AdaptiveCard",
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  version: "1.4",
                  body: [
                    { type: "TextBlock", weight: "Bolder", size: "Medium", text: "\($package) package publish to PyPI FAILED", color: "Attention" },
                    { type: "FactSet", facts: [
                      { title: "Tag name", value: $tag_name },
                      { title: "Triggered by", value: $actor },
                      { title: "Logs", value: $url }
                    ]}
                  ]
                }
              }]
            }')
          curl --fail --silent --show-error --max-time 30 \
            -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
