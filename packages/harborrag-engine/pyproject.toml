[project]
name = "harborrag-engine"
version = "0.1.0"
description = "Ingestion and retrieval orchestration for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["harborrag-core==0.1.0", "harborrag-adapters==0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_engine"]
