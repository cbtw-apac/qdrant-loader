[project]
name = "harborrag"
version = "0.1.0"
description = "Meta-package public facade for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "harborrag-core==0.1.0", 
    "harborrag-adapters==0.1.0", 
    "harborrag-engine==0.1.0", 
    "harborrag-runtime==0.1.0", 
    "harborrag-app==0.1.0", 
    "harborrag-mcp==0.1.0"
    ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag"]
