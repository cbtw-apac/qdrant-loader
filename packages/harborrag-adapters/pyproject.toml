[project]
name = "harborrag-adapters"
version = "2.0.0a2"
description = "Provider adapters for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "harborrag-core==2.0.0a2",
    "requests>=2.28.0",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
chunking = ["langchain-text-splitters>=1.1,<2"]
# Syntax-aware code splitting. Pins must match GRAMMAR_SET in
# harborrag_adapters/chunking/languages.py: split boundaries depend on them.
chunking-code = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bash>=0.25,<0.26",
    "tree-sitter-c>=0.24,<0.25",
    "tree-sitter-c-sharp>=0.23,<0.24",
    "tree-sitter-cpp>=0.23,<0.24",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-php>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-ruby>=0.23,<0.24",
    "tree-sitter-rust>=0.24,<0.25",
    "tree-sitter-typescript>=0.23,<0.24",
]
chunking-tokens = ["tiktoken>=0.9,<1"]
langchain = ["langchain-core>=1.5,<2"]
control-plane = [
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13",
    "aiosqlite>=0.20,<1",
    "greenlet>=3",
    "cryptography>=42,<51",
]
redis = ["redis>=5,<6"]
s3 = ["aiobotocore>=3,<4"]
qdrant = ["qdrant-client>=1.17,<1.20"]
falkordb = ["falkordb>=1.0,<2"]
postgres = ["asyncpg>=0.30,<1"]
tables = ["pyarrow==25.0.0"]
parsers = [
    "beautifulsoup4>=4.12.0",
    "defusedxml>=0.7.1",
    "docx2txt>=0.9",
    "liteparse>=2.5.0",
    "odfpy>=1.4.1",
    "olefile>=0.47",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.13",
    "python-pptx>=1.0.0",
    "xlrd>=2.0.1",
]
pdf = [
    "PyMuPDF>=1.24.0",
    "docling>=2.0.0",
    "liteparse>=2.5.0",
    "mineru>=3.4.4,<4",
    "onnxruntime>=1.20,<2",
    "paddleocr>=3.0.0",
    "rapidocr>=3.1,<4",
]
pdf-docling = [
    "docling>=2.0.0",
    "onnxruntime>=1.20,<2",
    "rapidocr>=3.1,<4",
]
pdf-pymupdf = ["PyMuPDF>=1.24.0"]
pdf-liteparse = ["liteparse>=2.5.0"]
pdf-mineru = ["mineru>=3.4.4,<4"]
pdf-ocr = ["paddleocr>=3.0.0"]
document = [
    "docx2txt>=0.9",
    "odfpy>=1.4.1",
    "olefile>=0.47",
    "defusedxml>=0.7.1",
]
spreadsheet = [
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
]
presentation = ["olefile>=0.47", "python-pptx>=1.0.0"]
markup = [
    "beautifulsoup4>=4.12.0",
    "defusedxml>=0.7.1",
]
image = [
    "liteparse>=2.5.0",
    "onnxruntime>=1.20,<2",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "rapidocr>=3.1,<4",
]
image-tesseract = [
    "Pillow>=10.0.0",
    "pytesseract>=0.3.13",
]
image-rapidocr = [
    "onnxruntime>=1.20,<2",
    "Pillow>=10.0.0",
    "rapidocr>=3.1,<4",
]
parsers-all = [
    "beautifulsoup4>=4.12.0",
    "defusedxml>=0.7.1",
    "docx2txt>=0.9",
    "docling>=2.0.0",
    "liteparse>=2.5.0",
    "mineru>=3.4.4,<4",
    "odfpy>=1.4.1",
    "olefile>=0.47",
    "onnxruntime>=1.20,<2",
    "openpyxl>=3.1.0",
    "paddleocr>=3.0.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.13",
    "python-pptx>=1.0.0",
    "rapidocr>=3.1,<4",
    "xlrd>=2.0.1",
]
llm = [
    "litellm>=1.106.0,<1.106.5",
    "pydantic>=2.13,<3",
    "PyYAML>=6.0,<7",
]
langfuse = ["langfuse>=4,<5"]
opentelemetry = [
    "opentelemetry-api>=1.45.2,<2",
    "opentelemetry-sdk>=1.45.1,<2",
]
test = [
    "litellm>=1.106.0,<1.106.5",
    "opentelemetry-api>=1.45.2,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.1,<8",
    "python-dotenv>=1,<2",
    "pyarrow==25.0.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
]
dev = [
    "ruff>=0.12,<1",
    "mypy>=1.16,<2",
    "types-PyYAML>=6.0,<7",
    "types-openpyxl>=3.1,<4",
    "types-xlrd>=2.0,<3",
    "types-defusedxml>=0.7,<1",
    "types-hvac>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_adapters"]
