[project]
name = "harborrag-app"
version = "0.1.0"
description = "CLI and API package boundary for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["harborrag-core==0.1.0", "harborrag-runtime==0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_app"]
