[project]
name = "harborrag-mcp"
version = "0.1.0"
description = "MCP facade and audited tools for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["harborrag-core==0.1.0", "harborrag-engine==0.1.0", "harborrag-runtime==0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_mcp"]
